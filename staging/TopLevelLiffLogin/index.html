<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>打卡系統 V2｜隔離登入驗證</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
  body{margin:0;font-family:system-ui,"Microsoft JhengHei",sans-serif;color:#203044;background:#f5f7fa;padding:20px}
  main{max-width:500px;margin:auto;padding:20px;background:#fff;border-radius:16px;box-shadow:0 2px 14px #0001}
  h1{font-size:22px;margin:0 0 12px}p{line-height:1.7}
  .box{border-radius:10px;background:#eef3f7;padding:14px;white-space:pre-wrap;margin:14px 0}
  button{border:0;border-radius:12px;padding:14px 18px;background:#26755a;color:#fff;font-size:16px;width:100%}
  button:disabled{background:#87928e}small{color:#697585}
  </style>
</head>
<body>
<main>
  <h1>打卡系統 V2.0｜隔離測試</h1>
  <p>這是獨立的 LINE 登入測試，不是正式員工打卡入口。此階段不提供寫入或打卡功能。</p>
  <button id="login" type="button">驗證 LINE 登入</button>
  <div id="status" class="box" role="status">尚未開始</div>
  <small>本頁不顯示或儲存 LINE ID Token。若遇到錯誤，請只提供畫面上的錯誤訊息。</small>
</main>
<script>
"use strict";
const CONFIG=Object.freeze({
  liffId:"2012136707-2dDU0aSJ",
  api:"https://script.google.com/macros/s/AKfycbyGRIgGhv4To0KbeTXSJPGke5OFwl5XUtiwHd9LkMXaLh4bG_2cziQkXJt0dQ8Tt3mG/exec",
  allowedResponseOrigins:["https://script.google.com"],
  expectedResponseSuffix:".googleusercontent.com"
});
const statusEl=document.getElementById("status"),button=document.getElementById("login");
let busy=false;
function status(s){statusEl.textContent=s}
function randomId(){
  if(!globalThis.crypto || !crypto.getRandomValues)throw Error("瀏覽器不支援安全識別碼");
  const arr=new Uint8Array(20);crypto.getRandomValues(arr);
  return Array.from(arr,v=>v.toString(16).padStart(2,"0")).join("");
}
function originOK(origin) {
  if(CONFIG.allowedResponseOrigins.includes(origin))return true;
  try {
    const u=new URL(origin);
    return u.protocol==="https:" &&
      (u.hostname==="script.googleusercontent.com" ||
       u.hostname.endsWith(CONFIG.expectedResponseSuffix));
  } catch(_) {return false}
}
function postForm(operation,payload) {
  return new Promise((resolve,reject)=>{
    let nonce;
    try{nonce=randomId()}catch(e){reject(e);return}
    const iframe=document.createElement("iframe");
    iframe.name="v2_"+nonce;
    iframe.style.display="none";
    iframe.setAttribute("aria-hidden","true");
    const form=document.createElement("form");
    form.style.display="none";form.method="POST";
    form.action=CONFIG.api;form.target=iframe.name;
    form.acceptCharset="UTF-8";
    const fields={nonce,operation,payload:JSON.stringify(payload)};
    for(const [key,value] of Object.entries(fields)){
      const input=document.createElement("input");
      input.type="hidden";input.name=key;input.value=value;
      form.appendChild(input);
    }
    let settled=false;
    const finish=(err,val)=>{
      if(settled)return;
      settled=true;clearTimeout(timer);
      window.removeEventListener("message",listener);
      form.remove();iframe.remove();
      if(err)reject(err);else resolve(val);
    };
    const listener=e=>{
      if(!originOK(e.origin)||!e.data||typeof e.data!=="object")return;
      const data=e.data;
      if(data.bridge!=="YC_V2_STAGING_FORM_V1" || data.nonce!==nonce)return;
      if(!data.ok)finish(Error(String(data.error||"LINE 驗證失敗")));
      else finish(null,data.result);
    };
    const timer=setTimeout(()=>finish(Error("驗證逾時，可能是 Google 限制內嵌回應；未確認結果")),45000);
    window.addEventListener("message",listener);
    document.body.appendChild(iframe);
    document.body.appendChild(form);
    try{form.submit()}catch(e){finish(e)}
  });
}
async function verifyLine(){
  if(busy)return;
  busy=true;button.disabled=true;button.textContent="正在處理…";
  try{
    status("正在初始化 LINE LIFF…");
    await liff.init({liffId:CONFIG.liffId});
    if(!liff.isLoggedIn()){
      status("正在跳轉至 LINE 登入…");
      liff.login();return;
    }
    const idToken=liff.getIDToken();
    if(!idToken)throw Error("LINE 沒有提供 ID Token，請重新開啟測試入口");
    status("LINE 登入已完成，正在向隔離測試後端確認身分…");
    const response=await postForm("whoami",{idToken});
    if(!response||!response.ok)throw Error("後端沒有確認身分");
    if(!response.bound){
      status("✅ LINE ID Token 經測試後端驗證成功。\n此帳號尚未綁定模擬員工（正常；稍後再測綁定）。");
    }else{
      status("✅ LINE 身分驗證成功，測試員工："+response.employee.name);
    }
  }catch(e){
    status("⚠️ 登入測試尚未完成："+String(e&&e.message||e));
  }finally{busy=false;button.disabled=false;button.textContent="驗證 LINE 登入";}
}
button.addEventListener("click",verifyLine);
// Do not force external-browser login before the person clicks the button.
</script>
</body>
</html>
