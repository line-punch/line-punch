<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>員工打卡系統</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body{
      margin:0;
      padding:20px;
      background:#f4f6f8;
      font-family:"Microsoft JhengHei", Arial, sans-serif;
      color:#333;
    }
    .wrap{
      max-width:520px;
      margin:0 auto;
    }
    .card{
      background:#fff;
      border-radius:18px;
      box-shadow:0 4px 16px rgba(0,0,0,.08);
      padding:22px;
      margin-bottom:16px;
    }
    h1{
      text-align:center;
      margin:0 0 8px 0;
      font-size:24px;
    }
    .subtitle{
      text-align:center;
      color:#666;
      margin-bottom:18px;
      font-size:14px;
    }
    h3{
      margin:0 0 14px 0;
      font-size:18px;
    }
    .row{
      margin-bottom:14px;
    }
    .label{
      font-size:15px;
      font-weight:700;
      margin-bottom:6px;
    }
    .value{
      background:#eef2f6;
      border-radius:12px;
      padding:12px;
      min-height:24px;
      white-space:pre-line;
      word-break:break-word;
    }
    input, select, textarea{
      width:100%;
      box-sizing:border-box;
      border:1px solid #d6dbe1;
      border-radius:12px;
      padding:12px;
      font-size:16px;
      background:#fff;
    }
    textarea{
      min-height:92px;
      resize:vertical;
    }
    .small{
      color:#777;
      font-size:13px;
      line-height:1.6;
      margin-top:6px;
    }
    .btns{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
      margin-top:18px;
    }
    button{
      width:100%;
      border:none;
      border-radius:12px;
      padding:14px 10px;
      color:#fff;
      font-size:16px;
      cursor:pointer;
    }
    .btn-blue{ background:#2f6df6; }
    .btn-green{ background:#5b9961; }
    .btn-red{ background:#cb5a52; }
    .msg{
      background:#eef3f8;
      border-radius:12px;
      padding:12px;
      margin-top:18px;
      min-height:24px;
      white-space:pre-line;
      line-height:1.6;
    }
    .loading{
      text-align:center;
      color:#666;
      min-height:20px;
      margin-top:14px;
    }
    .hidden{ display:none !important; }
    .page{ display:none; }
    .page.active{ display:block; }
    .table-list{
      background:#f7f9fb;
      border-radius:12px;
      padding:10px 12px;
      margin-top:12px;
      white-space:pre-line;
      line-height:1.7;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>員工打卡系統</h1>
      <div class="subtitle" id="pageTitle">載入中...</div>

      <div class="row">
        <div class="label">LINE 名稱</div>
        <div class="value" id="displayName">讀取中...</div>
      </div>

      <div id="employeeInfoBox" class="row hidden">
        <div class="label">員工資訊</div>
        <div class="value" id="employeeInfo">讀取中...</div>
      </div>

      <div id="bindBox" class="row hidden">
        <div class="label">首次綁定員工ID</div>
        <input type="text" id="empid" placeholder="第一次請輸入員工ID，例如 YT001">
        <div class="small">首次綁定成功後，之後同一個 LINE 將自動登入，不用再輸入員工ID。</div>
        <button class="btn-blue" style="margin-top:10px;" onclick="bindEmployee()">確認綁定</button>
        <div class="msg" id="bindMsg">尚未綁定，請先輸入員工ID。</div>
      </div>

      <!-- 正常打卡 -->
      <div id="page-clock" class="page">
        <h3>正常打卡區</h3>

        <div class="row">
          <div class="label">目前位置</div>
          <div class="value" id="locationText">尚未取得</div>
        </div>

        <div class="btns">
          <button class="btn-green" onclick="punch('上班')">上班</button>
          <button class="btn-red" onclick="punch('下班')">下班</button>
        </div>

        <div class="loading" id="loading"></div>
        <div class="msg" id="msg">系統初始化中...</div>
      </div>

      <!-- 補打卡 -->
      <div id="page-miss" class="page">
        <h3>補打卡申請區</h3>

        <div class="row">
          <div class="label">日期</div>
          <input type="date" id="missDate">
        </div>

        <div class="row">
          <div class="label">類型</div>
          <select id="missType">
            <option value="">請選擇</option>
            <option value="上班">上班</option>
            <option value="下班">下班</option>
          </select>
        </div>

        <div class="row">
          <div class="label">時間</div>
          <input type="time" id="missTime">
        </div>

        <div class="row">
          <div class="label">原因</div>
          <textarea id="missReason" placeholder="請輸入補打卡原因"></textarea>
        </div>

        <button class="btn-blue" onclick="submitMiss()">送出補打卡申請</button>
        <div class="msg" id="missMsg">請填寫補打卡資料後送出。</div>
      </div>

      <!-- 月查詢 -->
      <div id="page-query" class="page">
        <h3>個人（月）出勤查詢區</h3>

        <div class="row">
          <div class="label">月份</div>
          <input type="text" id="queryMonth" placeholder="請輸入 202603" maxlength="6">
          <div class="small">最多查詢最近 3 個月。格式：YYYYMM，例如 202603</div>
        </div>

        <button class="btn-blue" onclick="queryAttendance()">查詢月紀錄</button>
        <div class="msg" id="queryMsg">請輸入月份後查詢。</div>
        <div id="queryList" class="table-list hidden"></div>
      </div>

      <!-- 請假 -->
      <div id="page-leave" class="page">
        <h3>請假申請區</h3>

        <div class="row">
          <div class="label">請假日期</div>
          <input type="date" id="leaveDate">
        </div>

        <div class="row">
          <div class="label">請假區間</div>
          <select id="leaveUnit" onchange="toggleLeaveMode()">
            <option value="">請選擇</option>
            <option value="全天">全天</option>
            <option value="時數">時數</option>
          </select>
        </div>

        <div id="hourBox" class="hidden">
          <div class="row">
            <div class="label">開始時間</div>
            <input type="time" id="leaveStartTime">
          </div>
          <div class="row">
            <div class="label">結束時間</div>
            <input type="time" id="leaveEndTime">
          </div>
        </div>

        <div class="row">
          <div class="label">假別</div>
          <select id="leaveType">
            <option value="">請選擇</option>
            <option value="事假">事假</option>
            <option value="病假">病假</option>
            <option value="特休">特休</option>
            <option value="公假">公假</option>
            <option value="其他">其他</option>
          </select>
        </div>

        <div class="row">
          <div class="label">備註</div>
          <textarea id="leaveReason" placeholder="請輸入備註"></textarea>
        </div>

        <button class="btn-blue" onclick="submitLeave()">送出請假申請</button>
        <div class="msg" id="leaveMsg">請填寫請假資料後送出。</div>

        <div class="row" style="margin-top:22px;">
          <div class="label">我的請假申請紀錄</div>
          <button class="btn-blue" onclick="loadLeaveHistory()" style="margin-top:6px;">重新整理請假紀錄</button>
          <div id="leaveHistory" class="table-list">尚未查詢</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const LIFF_ID = "2009482137-QgqJEHgA";
    const API_URL = "https://script.google.com/macros/s/AKfycbxi93T80nRUb5UH47kFfcfM9BMPmJP4IolinOFe5xdBkRUefkTFS7s-f6WxP3I0s98/exec";

    let profileName = "";
    let lineUserId = "";
    let userLat = null;
    let userLng = null;
    let currentPage = "clock";
    let currentEmployee = null;

    function getPage() {
      const params = new URLSearchParams(window.location.search);
      return params.get("page") || "clock";
    }

    function showPage(page) {
      currentPage = page;
      document.querySelectorAll(".page").forEach(el => el.classList.remove("active"));

      const pageMap = {
        clock: "page-clock",
        miss: "page-miss",
        query: "page-query",
        leave: "page-leave"
      };

      const titleMap = {
        clock: "正常打卡",
        miss: "補打卡申請",
        query: "個人月查詢",
        leave: "請假系統"
      };

      const targetId = pageMap[page] || "page-clock";
      document.getElementById(targetId).classList.add("active");
      document.getElementById("pageTitle").innerText = titleMap[page] || "正常打卡";
    }

    function setLoading(text) {
      const el = document.getElementById("loading");
      if (el) el.innerText = text || "";
    }

    function setMsg(text) {
      const el = document.getElementById("msg");
      if (el) el.innerText = text || "";
    }

    function setBindMsg(text) {
      const el = document.getElementById("bindMsg");
      if (el) el.innerText = text || "";
    }

    function setMissMsg(text) {
      const el = document.getElementById("missMsg");
      if (el) el.innerText = text || "";
    }

    function setQueryMsg(text) {
      const el = document.getElementById("queryMsg");
      if (el) el.innerText = text || "";
    }

    function setLeaveMsg(text) {
      const el = document.getElementById("leaveMsg");
      if (el) el.innerText = text || "";
    }

    function getErrorMessage(err) {
      if (!err) return "未知錯誤";
      return err.message || String(err);
    }

    function toggleLeaveMode() {
      const unit = document.getElementById("leaveUnit").value;
      document.getElementById("hourBox").classList.toggle("hidden", unit !== "時數");
    }

    function buildQuery(params) {
      const usp = new URLSearchParams();
      Object.keys(params).forEach(key => {
        const v = params[key] == null ? "" : String(params[key]);
        usp.append(key, v);
      });
      return usp.toString();
    }

    function jsonpRequest(params) {
      return new Promise((resolve, reject) => {
        const cbName = "jsonp_cb_" + Date.now() + "_" + Math.floor(Math.random() * 100000);
        params.callback = cbName;

        const script = document.createElement("script");
        const timeoutId = setTimeout(() => {
          cleanup();
          reject(new Error("連線逾時，請稍後再試"));
        }, 15000);

        function cleanup() {
          clearTimeout(timeoutId);
          if (window[cbName]) delete window[cbName];
          if (script.parentNode) script.parentNode.removeChild(script);
        }

        window[cbName] = function(data) {
          cleanup();
          resolve(data);
        };

        script.onerror = function() {
          cleanup();
          reject(new Error("載入失敗"));
        };

        script.src = API_URL + "?" + buildQuery(params);
        document.body.appendChild(script);
      });
    }

    function renderEmployeeInfo(emp) {
      currentEmployee = emp;
      document.getElementById("employeeInfoBox").classList.remove("hidden");
      document.getElementById("employeeInfo").innerText =
        "姓名：" + (emp.name || "") + "\n" +
        "員工ID：" + (emp.employeeId || "") + "\n" +
        "公司：" + (emp.company || "") + "\n" +
        "部門：" + (emp.department || "");
    }

    function showBindMode() {
      document.getElementById("bindBox").classList.remove("hidden");
    }

    function hideBindMode() {
      document.getElementById("bindBox").classList.add("hidden");
    }

    function getActiveEmpid() {
      if (currentEmployee && currentEmployee.employeeId) return currentEmployee.employeeId;
      return document.getElementById("empid").value.trim();
    }

    function getCurrentMonthRange() {
      const today = new Date();
      const y = today.getFullYear();
      const m = today.getMonth();
      const first = new Date(y, m, 1);
      const last = new Date(y, m + 1, 0);
      const fmt = d => d.toISOString().slice(0, 10);
      return { first: fmt(first), last: fmt(last) };
    }

    function isMonthWithin3(monthStr) {
      if (!/^\d{6}$/.test(monthStr)) return false;
      const y = parseInt(monthStr.substring(0, 4), 10);
      const m = parseInt(monthStr.substring(4, 6), 10);
      const target = new Date(y, m - 1, 1);

      const now = new Date();
      const current = new Date(now.getFullYear(), now.getMonth(), 1);

      const monthsDiff = (current.getFullYear() - target.getFullYear()) * 12 + (current.getMonth() - target.getMonth());
      return monthsDiff >= 0 && monthsDiff <= 2;
    }

    async function initApp() {
      try {
        showPage(getPage());

        await liff.init({ liffId: LIFF_ID });

        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }

        const profile = await liff.getProfile();
        profileName = profile.displayName || "";
        lineUserId = profile.userId || "";
        document.getElementById("displayName").innerText = profileName || "未取得";

        const now = new Date();
        const y = now.getFullYear();
        const m = String(now.getMonth() + 1).padStart(2, "0");
        const queryMonthEl = document.getElementById("queryMonth");
        if (queryMonthEl) queryMonthEl.value = `${y}${m}`;

        const monthRange = getCurrentMonthRange();
        const missDateEl = document.getElementById("missDate");
        if (missDateEl) {
          missDateEl.min = monthRange.first;
          missDateEl.max = monthRange.last;
          missDateEl.value = monthRange.first;
        }

        const leaveDateEl = document.getElementById("leaveDate");
        if (leaveDateEl) leaveDateEl.value = monthRange.first;

        const who = await jsonpRequest({
          action: "whoami",
          userId: lineUserId
        });

        if (who.ok && who.bound) {
          renderEmployeeInfo(who.employee);
          hideBindMode();
          if (currentPage === "leave") {
            loadLeaveHistory();
          }
        } else {
          showBindMode();
          setBindMsg("尚未綁定，請先輸入員工ID完成首次綁定。");
        }

        if (currentPage === "clock") {
          setLoading("定位中...");
          setMsg("正在取得 GPS 位置...");
          getLocation();
        }

      } catch (err) {
        setLoading("");
        setMsg("初始化失敗：" + getErrorMessage(err));
      }
    }

    async function bindEmployee() {
      const empid = document.getElementById("empid").value.trim();
      if (!empid) {
        setBindMsg("請先輸入員工ID。");
        return;
      }

      setBindMsg("綁定中...");

      try {
        const result = await jsonpRequest({
          action: "bind",
          empid: empid,
          userId: lineUserId,
          name: profileName
        });

        if (!result.ok) {
          setBindMsg("❌ " + (result.message || "綁定失敗"));
          return;
        }

        renderEmployeeInfo(result.employee);
        hideBindMode();
        document.getElementById("empid").value = result.employee.employeeId || "";
        setBindMsg("✅ 綁定成功");

        if (currentPage === "leave") {
          loadLeaveHistory();
        }
      } catch (err) {
        setBindMsg("綁定失敗：" + getErrorMessage(err));
      }
    }

    function getLocation() {
      if (!navigator.geolocation) {
        setLoading("");
        document.getElementById("locationText").innerText = "此裝置不支援定位";
        setMsg("此裝置不支援定位功能。");
        return;
      }

      navigator.geolocation.getCurrentPosition(
        function(position) {
          userLat = position.coords.latitude;
          userLng = position.coords.longitude;
          setLoading("");
          document.getElementById("locationText").innerText =
            "緯度：" + userLat + "\n經度：" + userLng;
          setMsg("定位成功，可開始打卡。");
        },
        function(error) {
          setLoading("");
          document.getElementById("locationText").innerText = "定位失敗";

          let msg = "無法取得 GPS，請確認已開啟定位權限。";
          if (error && error.code === 1) msg = "你已拒絕定位權限，請到手機設定重新允許定位。";
          if (error && error.code === 2) msg = "無法取得定位資訊，請確認 GPS 或網路是否正常。";
          if (error && error.code === 3) msg = "定位逾時，請重新整理頁面後再試。";

          setMsg(msg);
        },
        {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 0
        }
      );
    }

    async function punch(type) {
      const empid = getActiveEmpid();

      if (!empid) {
        setMsg("請先完成首次綁定。");
        return;
      }

      if (userLat === null || userLng === null) {
        setMsg("尚未取得 GPS，請稍候，或重新整理頁面後再試。");
        getLocation();
        return;
      }

      setLoading("送出打卡中...");
      setMsg("");

      try {
        const result = await jsonpRequest({
          action: "clock",
          empid: empid,
          name: profileName,
          userId: lineUserId,
          type: type,
          lat: userLat,
          lng: userLng
        });

        setLoading("");

        if (result.ok) {
          setMsg(
            "✅ " + result.message + "\n" +
            "姓名：" + (result.name || "") + "\n" +
            "類型：" + (result.type || "") + "\n" +
            "地點：" + (result.placeName || "") + "\n" +
            "距離：" + (result.distance || 0) + " 公尺\n" +
            "時間：" + (result.time || "")
          );
        } else {
          setMsg("❌ " + (result.message || "打卡失敗"));
        }

      } catch (err) {
        setLoading("");
        setMsg("送出失敗：" + getErrorMessage(err));
      }
    }

    async function submitMiss() {
      const empid = getActiveEmpid();
      const date = document.getElementById("missDate").value;
      const type = document.getElementById("missType").value;
      const time = document.getElementById("missTime").value;
      const reason = document.getElementById("missReason").value.trim();

      if (!empid) {
        setMissMsg("請先完成首次綁定。");
        return;
      }
      if (!date || !type || !time || !reason) {
        setMissMsg("請完整填寫補打卡資料。");
        return;
      }

      setMissMsg("送出中...");

      try {
        const result = await jsonpRequest({
          action: "miss",
          empid: empid,
          name: profileName,
          userId: lineUserId,
          date: date,
          type: type,
          time: time,
          reason: reason
        });

        if (result.ok) {
          setMissMsg("✅ " + (result.message || "補打卡申請已送出"));
        } else {
          setMissMsg("❌ " + (result.message || "補打卡送出失敗"));
        }
      } catch (err) {
        setMissMsg("送出失敗：" + getErrorMessage(err));
      }
    }

    async function queryAttendance() {
      const empid = getActiveEmpid();
      const month = document.getElementById("queryMonth").value.trim();
      const listEl = document.getElementById("queryList");

      if (!empid) {
        setQueryMsg("請先完成首次綁定。");
        listEl.classList.add("hidden");
        return;
      }
      if (!/^[0-9]{6}$/.test(month)) {
        setQueryMsg("月份格式錯誤，請輸入 202603 這種格式。");
        listEl.classList.add("hidden");
        return;
      }
      if (!isMonthWithin3(month)) {
        setQueryMsg("最多只能查詢最近 3 個月。");
        listEl.classList.add("hidden");
        return;
      }

      setQueryMsg("查詢中...");
      listEl.classList.add("hidden");
      listEl.innerText = "";

      try {
        const result = await jsonpRequest({
          action: "query",
          empid: empid,
          userId: lineUserId,
          month: month
        });

        if (!result.ok) {
          setQueryMsg("❌ " + (result.message || "查詢失敗"));
          return;
        }

        const rows = result.data || [];
        const total = result.total || 0;

        setQueryMsg("✅ 查詢成功，整月總筆數：" + total);

        if (!rows.length) {
          listEl.classList.remove("hidden");
          listEl.innerText = "查無資料";
          return;
        }

        let text = "";
        rows.forEach((r, i) => {
          text += `${i + 1}. 日期：${r.date}｜時間：${r.time}｜類型：${r.type}｜地點：${r.placeName || ""}\n`;
        });
        listEl.classList.remove("hidden");
        listEl.innerText = text;
      } catch (err) {
        setQueryMsg("查詢失敗：" + getErrorMessage(err));
      }
    }

    async function submitLeave() {
      const empid = getActiveEmpid();
      const leaveDate = document.getElementById("leaveDate").value;
      const type = document.getElementById("leaveType").value;
      const unit = document.getElementById("leaveUnit").value;
      const startTime = document.getElementById("leaveStartTime").value;
      const endTime = document.getElementById("leaveEndTime").value;
      const reason = document.getElementById("leaveReason").value.trim();

      if (!empid) {
        setLeaveMsg("請先完成首次綁定。");
        return;
      }
      if (!leaveDate || !type || !unit) {
        setLeaveMsg("請完整填寫請假資料。");
        return;
      }
      if (unit === "時數" && (!startTime || !endTime)) {
        setLeaveMsg("請輸入開始時間與結束時間。");
        return;
      }

      setLeaveMsg("送出中...");

      try {
        const result = await jsonpRequest({
          action: "leave",
          empid: empid,
          name: profileName,
          userId: lineUserId,
          leaveDate: leaveDate,
          type: type,
          unit: unit,
          startTime: startTime,
          endTime: endTime,
          reason: reason
        });

        if (result.ok) {
          setLeaveMsg("✅ " + (result.message || "請假申請已送出"));
          loadLeaveHistory();
        } else {
          setLeaveMsg("❌ " + (result.message || "請假送出失敗"));
        }
      } catch (err) {
        setLeaveMsg("送出失敗：" + getErrorMessage(err));
      }
    }

    async function loadLeaveHistory() {
      const empid = getActiveEmpid();
      const box = document.getElementById("leaveHistory");

      if (!empid) {
        box.innerText = "請先完成首次綁定。";
        return;
      }

      box.innerText = "載入中...";

      try {
        const result = await jsonpRequest({
          action: "leaveHistory",
          empid: empid,
          userId: lineUserId
        });

        if (!result.ok) {
          box.innerText = "查詢失敗：" + (result.message || "");
          return;
        }

        const rows = result.data || [];
        if (!rows.length) {
          box.innerText = "目前沒有請假申請紀錄。";
          return;
        }

        let text = "";
        rows.forEach((r, i) => {
          text += `${i + 1}. 日期：${r.date}｜假別：${r.type}｜區間：${r.range}｜狀態：${r.status}\n`;
        });
        box.innerText = text;
      } catch (err) {
        box.innerText = "查詢失敗：" + getErrorMessage(err);
      }
    }

    initApp();
  </script>
</body>
</html>
