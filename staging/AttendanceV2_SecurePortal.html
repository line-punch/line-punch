<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>V2 安全登入隔離測試</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body{font-family:system-ui,"Microsoft JhengHei",sans-serif;background:#f5f6f8;color:#243042;margin:0;padding:16px}
    main{max-width:560px;margin:auto;background:#fff;border-radius:16px;padding:18px;box-shadow:0 2px 10px #0001}
    h1{font-size:20px}p{line-height:1.6}
    button{width:100%;border:0;border-radius:12px;background:#26755a;color:#fff;padding:14px;margin-top:12px;font-size:16px}
    button:disabled{background:#999}
    .status{background:#eef2f5;padding:12px;border-radius:10px;white-space:pre-wrap}
    input{box-sizing:border-box;width:100%;padding:12px;border:1px solid #aaa;border-radius:10px;font-size:16px}
  </style>
</head>
<body>
<main>
  <h1>LINE 安全登入隔離測試</h1>
  <p>此頁只連到獨立測試專案，提供安全登入、個人查詢與測試用 GPS 打卡。不得連接正式員工資料。</p>
  <div class="status" id="status" role="status">尚未開始</div>
  <button id="login" type="button" onclick="start()">驗證 LINE 身分</button>
  <section id="after" hidden>
    <p><strong id="employee"></strong></p>
    <label for="month">查詢月份（當月及前兩個月）</label>
    <input id="month" maxlength="6" inputmode="numeric">
    <button id="query" type="button" onclick="queryRecords()">查詢我的出勤紀錄</button>
    <div class="status" id="records">尚未查詢</div>
    <hr>
    <h2>測試 GPS 打卡</h2>
    <p>只操作測試用的 Google Sheet，實際時間由後端產生。</p>
    <button id="clockIn" type="button" onclick="testClock('上班')">測試上班打卡</button>
    <button id="clockOut" type="button" onclick="testClock('下班')">測試下班打卡</button>
    <button id="clockCheck" type="button" onclick="checkClockStatus()">確認上一筆打卡結果</button>
    <div class="status" id="clockStatus" role="status">尚未送出測試打卡</div>
  </section>
</main>
<script>
  const LIFF_ID=<?!= JSON.stringify(liffId) ?>;
  let idToken='';
  let clockBusy=false;
  const pendingKey='attendance-v2-test-clock';
  function requestId(){
    if(window.crypto?.randomUUID)return window.crypto.randomUUID();
    if(!window.crypto?.getRandomValues)throw Error('無法產生安全打卡編號');
    const bytes=new Uint8Array(16);
    window.crypto.getRandomValues(bytes);
    return Array.from(bytes,b=>b.toString(16).padStart(2,'0')).join('');
  }
  function pending(){
    try{return JSON.parse(sessionStorage.getItem(pendingKey)||'null');}catch(_e){return null;}
  }
  function pendingSet(value){
    sessionStorage.setItem(pendingKey,JSON.stringify(value));
  }
  function busyClock(value){
    clockBusy=value;
    ['clockIn','clockOut','clockCheck'].forEach(id=>$(id).disabled=value);
  }
  function obtainGPS(){
    return new Promise((resolve,reject)=>{
      if(!navigator.geolocation)return reject(Error('此裝置不支援定位'));
      navigator.geolocation.getCurrentPosition(
        p=>resolve({lat:p.coords.latitude,lng:p.coords.longitude}),
        e=>reject(Error('定位失敗：'+(e?.message||'無法取得位置'))),
        {enableHighAccuracy:true,timeout:12000,maximumAge:0});
    });
  }
  const $=id=>document.getElementById(id);
  function callGAS(method,payload){
    return new Promise((resolve,reject)=>{
      google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[method](payload);
    });
  }
  async function working(btn,action){
    if(btn.disabled)return;
    btn.disabled=true;
    const text=btn.textContent;btn.textContent='正在處理…';
    try{await action()}
    finally{btn.disabled=false;btn.textContent=text}
  }
  async function start(){
    await working($('login'),async()=>{
      try{
        $('status').textContent='正在初始化 LINE…';
        if(!LIFF_ID)throw Error('測試 LIFF 尚未設定');
        await liff.init({liffId:LIFF_ID});
        if(!liff.isLoggedIn()){liff.login();return}
        idToken=liff.getIDToken();
        if(!idToken)throw Error('無法取得 LINE ID Token');
        $('status').textContent='正在向後端驗證身分…';
        const r=await callGAS('v2WhoamiSecure',{idToken});
        if(!r.ok)throw Error('後端驗證未成功');
        if(!r.bound){
          $('status').textContent='此測試 LINE 尚未綁定員工；不會自動建立綁定';
          return;
        }
        $('employee').textContent='已驗證：'+r.employee.name+'（'+r.employee.employeeId+'）';
        $('status').textContent='LINE 身分驗證成功，可查看個人測試出勤';
        $('after').hidden=false;
        const d=new Date();
        $('month').value=d.getFullYear()+String(d.getMonth()+1).padStart(2,'0');
      }catch(e){$('status').textContent='驗證尚未完成：'+(e.message||String(e))}
    });
  }
  async function testClock(type){
    if(clockBusy)return;
    busyClock(true);
    const box=$('clockStatus');
    try{
      if(pending()){
        box.textContent='上一筆打卡尚未確認，請先查詢結果，不要再次送出。';
        return;
      }
      box.textContent='正在取得 GPS 定位…';
      const gps=await obtainGPS();
      const request={requestId:requestId(),type,lat:gps.lat,lng:gps.lng};
      pendingSet(request);
      box.textContent='正在送出測試打卡…';
      const r=await callGAS('v2ClockSecure',{idToken,...request});
      if(r.ok&&r.found){
        sessionStorage.removeItem(pendingKey);
        box.textContent='✅ '+r.message+'\n'+r.date+' '+r.time+'｜'+r.type;
      }else if(r.code==='ALREADY_CLOCKED'){
        sessionStorage.removeItem(pendingKey);
        box.textContent='⚠️ '+r.message;
      }else box.textContent='⚠️ 結果尚未確認，請先查詢';
    }catch(e){
      box.textContent=pending()
        ? '⚠️ 送出結果尚未確認：'+(e.message||String(e))+'\n請查詢上一筆結果。'
        : '尚未送出：'+(e.message||String(e));
    }finally{busyClock(false)}
  }
  async function checkClockStatus(){
    if(clockBusy)return;
    busyClock(true);
    const box=$('clockStatus');
    try{
      const request=pending();
      if(!request){box.textContent='沒有待確認的打卡';return;}
      box.textContent='正在確認打卡結果…';
      const r=await callGAS('v2ClockStatusSecure',{idToken,requestId:request.requestId});
      if(r.ok&&r.found){
        sessionStorage.removeItem(pendingKey);
        box.textContent='✅ 打卡已確認：'+r.date+' '+r.time+'｜'+r.type;
      }else box.textContent='尚未找到紀錄，可能仍在寫入，請稍後再次查詢。';
    }catch(e){box.textContent='查詢失敗，請稍後重試：'+(e.message||String(e));}
    finally{busyClock(false);}
  }
  async function queryRecords(){
    await working($('query'),async()=>{
      $('records').textContent='正在查詢…';
      try{
        const r=await callGAS('v2QueryAttendanceSecure',{idToken,month:$('month').value.trim()});
        $('records').textContent='查詢完成：'+r.total+' 筆\n'+
          (r.data||[]).map(x=>[x.date,x.time,x.type,x.placeName].join(' | ')).join('\n');
      }catch(e){$('records').textContent='查詢失敗：'+(e.message||String(e))}
    });
  }
</script>
</body></html>
