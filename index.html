<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>LINE打卡系統</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { font-family: Arial; background:#f4f6f8; margin:0;}
    .wrap { max-width:500px; margin:auto; padding:20px;}
    .card { background:#fff; padding:20px; border-radius:12px;}
    button { width:48%; padding:12px; margin:5px 1%; border:none; border-radius:8px; color:#fff; font-size:16px;}
    .green{background:#4caf50;}
    .orange{background:#ff9800;}
    .purple{background:#673ab7;}
    .red{background:#f44336;}
  </style>
</head>

<body>
<div class="wrap">
<div class="card">

<h2 id="title">載入中...</h2>

<div id="content"></div>

</div>
</div>

<script>
const LIFF_ID = "2009482137-QgqJEHgA";
const GAS_URL = "https://script.google.com/macros/s/AKfycbxi93T80nRUb5UH47kFfcfM9BMPmJP4IolinOFe5xdBkRUefkTFS7s-f6WxP3I0s98/exec";

// ⭐ 判斷是哪個頁面
const urlParams = new URLSearchParams(window.location.search);
const page = urlParams.get('page') || 'home';

// ⭐ 初始化
async function init(){
  await liff.init({ liffId: LIFF_ID });

  if(!liff.isLoggedIn()){
    liff.login();
    return;
  }

  loadPage();
}

// ⭐ 切頁核心
function loadPage(){
  const content = document.getElementById("content");
  const title = document.getElementById("title");

  if(page === "clock"){
    title.innerText = "正常打卡";

    content.innerHTML = `
      <input id="empId" placeholder="員工ID" style="width:100%;padding:10px;"><br><br>

      <button class="green" onclick="clock('上班')">上班</button>
      <button class="red" onclick="clock('下班')">下班</button>
    `;
  }

  else if(page === "miss"){
    title.innerText = "補打卡申請";

    content.innerHTML = `
      <input placeholder="日期"><br><br>
      <input placeholder="時間"><br><br>
      <textarea placeholder="原因"></textarea><br><br>
      <button class="orange">送出</button>
    `;
  }

  else if(page === "query"){
    title.innerText = "個人月查詢";

    content.innerHTML = `
      <input placeholder="月份 202603"><br><br>
      <button class="purple">查詢</button>
    `;
  }

  else if(page === "leave"){
    title.innerText = "請假系統";

    content.innerHTML = `
      <input placeholder="開始日期"><br><br>
      <input placeholder="結束日期"><br><br>
      <select>
        <option>全天</option>
        <option>半天</option>
        <option>時數</option>
      </select><br><br>
      <button class="orange">送出請假</button>
    `;
  }

  else {
    title.innerText = "首頁";

    content.innerHTML = `
      <button onclick="go('clock')">正常打卡</button>
      <button onclick="go('miss')">補打卡</button>
      <button onclick="go('query')">查詢</button>
      <button onclick="go('leave')">請假</button>
    `;
  }
}

// ⭐ 跳頁
function go(p){
  window.location.href = "?page=" + p;
}

// ⭐ 打卡
async function clock(type){
  const empId = document.getElementById("empId").value;

  const res = await fetch(GAS_URL,{
    method:"POST",
    body: JSON.stringify({
      action:"clock",
      type,
      empId
    })
  });

  alert("打卡完成");
}

init();
</script>

</body>
</html>
