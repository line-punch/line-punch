<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>V2 安全登入隔離測試</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body{font-family:system-ui,"Microsoft JhengHei",sans-serif;background:#f5f6f8;color:#243042;margin:0;padding:16px}
    main{max-width:560px;margin:auto;background:#fff;border-radius:16px;padding:18px;box-shadow:0 2px 10px #0001}
    h1{font-size:20px}p{line-height:1.6}
    button{width:100%;border:0;border-radius:12px;background:#26755a;color:#fff;padding:14px;margin-top:12px;font-size:16px}
    button:disabled{background:#999}
    .status{background:#eef2f5;padding:12px;border-radius:10px;white-space:pre-wrap}
    input{box-sizing:border-box;width:100%;padding:12px;border:1px solid #aaa;border-radius:10px;font-size:16px}
  </style>
</head>
<body>
<main>
  <h1>LINE 安全登入隔離測試</h1>
  <p>此頁只用來驗證 LINE 身分與個人資料查詢，不提供正式打卡與送出請假功能。</p>
  <div class="status" id="status" role="status">尚未開始</div>
  <button id="login" type="button" onclick="start()">驗證 LINE 身分</button>
  <section id="after" hidden>
    <p><strong id="employee"></strong></p>
    <label for="month">查詢月份（當月及前兩個月）</label>
    <input id="month" maxlength="6" inputmode="numeric">
    <button id="query" type="button" onclick="queryRecords()">查詢我的出勤紀錄</button>
    <div class="status" id="records">尚未查詢</div>
  </section>
</main>
<script>
  const LIFF_ID=<?!= JSON.stringify(liffId) ?>;
  let idToken='';
  const $=id=>document.getElementById(id);
  function callGAS(method,payload){
    return new Promise((resolve,reject)=>{
      google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[method](payload);
    });
  }
  async function working(btn,action){
    if(btn.disabled)return;
    btn.disabled=true;
    const text=btn.textContent;btn.textContent='正在處理…';
    try{await action()}
    finally{btn.disabled=false;btn.textContent=text}
  }
  async function start(){
    await working($('login'),async()=>{
      try{
        $('status').textContent='正在初始化 LINE…';
        if(!LIFF_ID)throw Error('測試 LIFF 尚未設定');
        await liff.init({liffId:LIFF_ID});
        if(!liff.isLoggedIn()){liff.login();return}
        idToken=liff.getIDToken();
        if(!idToken)throw Error('無法取得 LINE ID Token');
        $('status').textContent='正在向後端驗證身分…';
        const r=await callGAS('v2WhoamiSecure',{idToken});
        if(!r.ok)throw Error('後端驗證未成功');
        if(!r.bound){
          $('status').textContent='此測試 LINE 尚未綁定員工；不會自動建立綁定';
          return;
        }
        $('employee').textContent='已驗證：'+r.employee.name+'（'+r.employee.employeeId+'）';
        $('status').textContent='LINE 身分驗證成功，可查看個人測試出勤';
        $('after').hidden=false;
        const d=new Date();
        $('month').value=d.getFullYear()+String(d.getMonth()+1).padStart(2,'0');
      }catch(e){$('status').textContent='驗證尚未完成：'+(e.message||String(e))}
    });
  }
  async function queryRecords(){
    await working($('query'),async()=>{
      $('records').textContent='正在查詢…';
      try{
        const r=await callGAS('v2QueryAttendanceSecure',{idToken,month:$('month').value.trim()});
        $('records').textContent='查詢完成：'+r.total+' 筆\n'+
          (r.data||[]).map(x=>[x.date,x.time,x.type,x.placeName].join(' | ')).join('\n');
      }catch(e){$('records').textContent='查詢失敗：'+(e.message||String(e))}
    });
  }
</script>
</body></html>
